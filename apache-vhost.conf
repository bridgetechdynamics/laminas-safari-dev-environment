<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    # Local maintenance mode: create app/.maintenance on the host. The source
    # project is mounted at /var/www/html by Compose.
    RewriteEngine On
    RewriteCond /var/www/html/.maintenance -f
    RewriteCond %{REQUEST_URI} !^/maintenance\.php$
    RewriteCond %{REQUEST_URI} !^/maintenance\.html$
    RewriteCond %{REQUEST_URI} !^/newsletter/
    RewriteRule ^ /maintenance.php [END]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

