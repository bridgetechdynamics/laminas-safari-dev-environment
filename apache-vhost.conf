<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/public

    # The application stores maintenance.php above the public document root.
    # Expose only that entry point so maintenance mode does not require moving
    # the application document root.
    Alias /maintenance.php /var/www/html/maintenance.php

    <Directory /var/www/html>
        Require all granted
    </Directory>

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    # Local maintenance mode: create app/.maintenance on the host. The source
    # project is mounted at /var/www/html by Compose.
    RewriteEngine On
    RewriteCond /var/www/html/.maintenance -f
    RewriteCond %{REQUEST_URI} !^/maintenance\.php$
    RewriteCond %{REQUEST_URI} !^/maintenance\.html$
    RewriteCond %{REQUEST_URI} !^/newsletter/
    RewriteRule ^ /maintenance.php [L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

